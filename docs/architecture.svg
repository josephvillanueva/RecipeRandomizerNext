<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 548" width="1300" height="548" role="img" aria-labelledby="t"><title id="t">Recipe Randomizer architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1300" height="548" rx="14"/><rect class="zone" x="16" y="16" width="320" height="484" rx="12"/><text class="zlabel" x="36" y="46">BROWSER</text><text class="zsub" x="36" y="66">Client component, no API key</text><rect class="zone" x="384" y="16" width="520" height="484" rx="12"/><text class="zlabel" x="404" y="46">VERCEL</text><text class="zsub" x="404" y="66">Next.js API routes, where the key lives</text><rect class="zone" x="976" y="16" width="308" height="484" rx="12"/><text class="zlabel" x="996" y="46">EXTERNAL</text><text class="zsub" x="996" y="66">Spoonacular</text><path class="edge" d="M176,174 L176,240" marker-end="url(#arrow)"/><path class="edge" d="M312,254.8 L350,254.8 Q360,254.8 360,244.8 L360,155.5 Q360,145.5 370,145.5 L408,145.5" marker-end="url(#arrow)"/><path class="edge" d="M312,277 L408,277" marker-end="url(#arrow)"/><path class="edge" d="M644,145.5 L654,145.5 Q664,145.5 664,155.5 L664,182.3 Q664,192.3 674,192.3 L684,192.3" marker-end="url(#arrow)"/><path class="edge" d="M644,277 L654,277 Q664,277 664,267 L664,238.7 Q664,228.7 674,228.7 L684,228.7" marker-end="url(#arrow)"/><path class="edge" d="M880,202.037 L1000,202" marker-end="url(#arrow)"/><path class="edge" d="M176,314 L176,390" marker-end="url(#arrow)"/><path class="edge" d="M312,427 L408,427" marker-end="url(#arrow)"/><path class="edge" d="M644,427 L1000,427" marker-end="url(#arrow)"/><rect class="node" x="40" y="100" width="272" height="74" rx="10"/><text class="ntitle" x="56" y="127">RecipeFilter</text><text class="ntext" x="56" y="148">Ingredient chips input</text><text class="ntext" x="56" y="165">Surprise me button</text><rect class="node" x="40" y="240" width="272" height="74" rx="10"/><text class="ntitle" x="56" y="267">page.tsx</text><text class="ntext" x="56" y="288">One view state: idle, loading,</text><text class="ntext" x="56" y="305">error, matches, or random</text><rect class="node" x="40" y="390" width="272" height="74" rx="10"/><text class="ntitle" x="56" y="417">Result views</text><text class="ntext" x="56" y="438">RecipeDisplay for matches</text><text class="ntext" x="56" y="455">RandomRecipeCard for random</text><rect class="node" x="408" y="100" width="236" height="91" rx="10"/><text class="ntitle" x="424" y="127">GET /api/recipes/filter</text><text class="ntext" x="424" y="148">Validates input, 500 char max</text><text class="ntext" x="424" y="165">12 results ranked by overlap</text><text class="ntext" x="424" y="182">Pantry staples ignored</text><rect class="node" x="408" y="240" width="236" height="74" rx="10"/><text class="ntitle" x="424" y="267">GET /api/recipes/random</text><text class="ntext" x="424" y="288">Trims the payload to the</text><text class="ntext" x="424" y="305">fields the page renders</text><rect class="node key" x="684" y="165" width="196" height="91" rx="10"/><text class="ntitle" x="700" y="192">lib/spoonacular.js</text><text class="ntext" x="700" y="213">Adds API_KEY from env</text><text class="ntext" x="700" y="230">10 s timeout</text><text class="ntext" x="700" y="247">402/429 → 429, else 502</text><rect class="node" x="408" y="390" width="236" height="74" rx="10"/><text class="ntitle" x="424" y="417">next/image optimizer</text><text class="ntext" x="424" y="438">Resizes photos for each</text><text class="ntext" x="424" y="455">screen size</text><rect class="node" x="1000" y="165" width="260" height="74" rx="10"/><text class="ntitle" x="1016" y="192">Spoonacular API</text><text class="ntext" x="1016" y="213">/recipes/findByIngredients</text><text class="ntext" x="1016" y="230">/recipes/random</text><rect class="node" x="1000" y="390" width="260" height="74" rx="10"/><text class="ntitle" x="1016" y="417">img.spoonacular.com</text><text class="ntext" x="1016" y="438">Recipe photos, fetched by</text><text class="ntext" x="1016" y="455">the optimizer</text><rect class="pill" x="150.68" y="197" width="50.64" height="20" rx="5"/><text class="elabel" x="176" y="211" text-anchor="middle">submit</text><rect class="pill" x="911.46" y="185.01850000000002" width="57.080000000000005" height="34" rx="5"/><text class="elabel" x="940" y="199.01850000000002" text-anchor="middle">HTTPS +</text><text class="elabel" x="940" y="213.01850000000002" text-anchor="middle">API key</text><rect class="pill" x="147.46" y="342" width="57.080000000000005" height="20" rx="5"/><text class="elabel" x="176" y="356" text-anchor="middle">renders</text><rect class="pill" x="315.36" y="417" width="89.28" height="20" rx="5"/><text class="elabel" x="360" y="431" text-anchor="middle">/_next/image</text><rect class="pill" x="764.48" y="417" width="115.04" height="20" rx="5"/><text class="elabel" x="822" y="431" text-anchor="middle">fetches original</text><path class="edge" d="M36,522 L70,522" marker-end="url(#arrow)"/><text class="legend" x="80" y="526">Call or request (responses return the same way)</text><rect class="node key" x="425.84000000000003" y="514" width="22" height="16" rx="4"/><text class="legend" x="455.84000000000003" y="526">Core logic</text></svg>
